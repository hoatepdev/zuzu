services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zuzu
      POSTGRES_PASSWORD: zuzu
      POSTGRES_DB: zuzu
    ports:
      - "5433:5432"
    volumes:
      - zuzu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuzu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zuzu_postgres:
